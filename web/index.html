<h1>粉丝体检</h1>
<p>拖文件的网页版已经收进油猴脚本。安装 <code>userscript/fan-audit.user.js</code>，在 X 上打开右下角的「粉丝体检」。twitter-web-exporter 导出的 JSON 用面板里的「导入导出文件」。</p>
<p>安装步骤写在仓库说明里：<a href="https://github.com/ratt1e/Xfan-audit">ratt1e/Xfan-audit</a>。</p>
<p>想每晚自动采集，用说明里的 Grok Bot 模板。数据只在你自己的浏览器或电脑里处理，不会上传，也不会替你关注或取关。油猴版默认自己往下翻。自动读取名单在面板里，默认关闭。</p>
